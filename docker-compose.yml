# Local stack: Postgres, a one-shot migration, then the service.
# Credentials come from .env (copy .env.example); none are written here.

x-service-env: &service-env
  DATABASE_URL: postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}?sslmode=disable
  HTTP_ADDR: ${HTTP_ADDR:-:8080}
  DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
  REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10s}
  MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
  MAX_OPERATION_AMOUNT_MINOR: ${MAX_OPERATION_AMOUNT_MINOR:-100000000}
  SHUTDOWN_DELAY: ${SHUTDOWN_DELAY:-5s}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: wallet-and-payment:dev
    command: ["migrate"]
    environment: *service-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    image: wallet-and-payment:dev
    command: ["serve"]
    environment: *service-env
    ports:
      - "8080:8080"
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
